<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="1120" height="330" rx="14" fill="#0f1115"/>

  <text x="40" y="40" fill="#e8eaf0" font-size="17" font-weight="700">교시 코드 → 실제 시간</text>
  <text x="40" y="62" fill="#8b93a3" font-size="12.5">1교시 = 09:00 · A = 정각 · B = 30분 · 한 교시 = 60분</text>

  <!-- hour ticks -->
  <g font-size="11" fill="#8b93a3" text-anchor="middle">
    <text x="60" y="100">9:00</text><text x="140" y="100">10:00</text><text x="220" y="100">11:00</text>
    <text x="300" y="100">12:00</text><text x="380" y="100">13:00</text><text x="460" y="100">14:00</text>
    <text x="540" y="100">15:00</text><text x="620" y="100">16:00</text><text x="700" y="100">17:00</text>
    <text x="780" y="100">18:00</text><text x="860" y="100">19:00</text><text x="940" y="100">20:00</text>
    <text x="1020" y="100">21:00</text>
  </g>
  <g stroke="#262b35" stroke-width="1">
    <path d="M60 108 V250 M140 108 V250 M220 108 V250 M300 108 V250 M380 108 V250 M460 108 V250 M540 108 V250 M620 108 V250 M700 108 V250 M780 108 V250 M860 108 V250 M940 108 V250 M1020 108 V250"/>
  </g>

  <!-- period bar -->
  <g>
    <rect x="60" y="112" width="960" height="34" rx="6" fill="#171a21" stroke="#262b35"/>
    <g stroke="#2c3140" stroke-width="1">
      <path d="M100 112 V146 M180 112 V146 M260 112 V146 M340 112 V146 M420 112 V146 M500 112 V146 M580 112 V146 M660 112 V146 M740 112 V146 M820 112 V146 M900 112 V146 M980 112 V146" stroke-dasharray="3 3"/>
    </g>
    <g stroke="#3a4150" stroke-width="1.5">
      <path d="M140 112 V146 M220 112 V146 M300 112 V146 M380 112 V146 M460 112 V146 M540 112 V146 M620 112 V146 M700 112 V146 M780 112 V146 M860 112 V146 M940 112 V146"/>
    </g>
    <g font-size="11" fill="#c3cad6" text-anchor="middle" font-weight="600">
      <text x="80" y="134">1A</text><text x="120" y="134">1B</text>
      <text x="160" y="134">2A</text><text x="200" y="134">2B</text>
      <text x="240" y="134">3A</text><text x="280" y="134">3B</text>
      <text x="320" y="134">4A</text><text x="360" y="134">4B</text>
      <text x="400" y="134">5A</text><text x="440" y="134">5B</text>
      <text x="480" y="134">6A</text><text x="520" y="134">6B</text>
      <text x="560" y="134">7A</text><text x="600" y="134">7B</text>
      <text x="640" y="134">8A</text><text x="680" y="134">8B</text>
      <text x="720" y="134">9A</text><text x="760" y="134">9B</text>
      <text x="800" y="134">10A</text><text x="840" y="134">10B</text>
      <text x="880" y="134">11A</text><text x="920" y="134">11B</text>
      <text x="960" y="134">12A</text><text x="1000" y="134">12B</text>
    </g>
  </g>
  <text x="40" y="134" fill="#8b93a3" font-size="11" text-anchor="end">교시</text>

  <!-- example course blocks -->
  <text x="40" y="178" fill="#8b93a3" font-size="11" text-anchor="end">예시</text>
  <g>
    <rect x="140" y="158" width="240" height="28" rx="6" fill="#6ea8fe"/>
    <text x="260" y="177" fill="#0f1115" font-size="11.5" font-weight="700" text-anchor="middle">2A~4B = 10:00–13:00</text>
    <rect x="460" y="158" width="240" height="28" rx="6" fill="#7bd88f"/>
    <text x="580" y="177" fill="#0f1115" font-size="11.5" font-weight="700" text-anchor="middle">6A~8B = 14:00–17:00</text>
    <rect x="780" y="158" width="240" height="28" rx="6" fill="#c792ea"/>
    <text x="900" y="177" fill="#0f1115" font-size="11.5" font-weight="700" text-anchor="middle">10A~12B = 18:00–21:00 (야간)</text>
  </g>

  <!-- TA window -->
  <text x="40" y="222" fill="#8b93a3" font-size="11" text-anchor="end">조교</text>
  <g>
    <rect x="60" y="202" width="680" height="28" rx="6" fill="none" stroke="#4dd4c4" stroke-dasharray="5 4"/>
    <g fill="rgba(77,212,196,.14)" stroke="rgba(77,212,196,.5)">
      <rect x="64" y="206" width="72" height="20" rx="4"/><rect x="144" y="206" width="72" height="20" rx="4"/>
      <rect x="224" y="206" width="72" height="20" rx="4"/><rect x="304" y="206" width="72" height="20" rx="4"/>
      <rect x="384" y="206" width="72" height="20" rx="4"/><rect x="464" y="206" width="72" height="20" rx="4"/>
      <rect x="544" y="206" width="72" height="20" rx="4"/><rect x="624" y="206" width="72" height="20" rx="4"/>
      <rect x="704" y="206" width="32" height="20" rx="4"/>
    </g>
    <text x="770" y="221" fill="#4dd4c4" font-size="11.5" font-weight="600">근무 가능 09:00–17:30 · 1시간 칸 8개 + 반칸 1개</text>
  </g>

  <!-- footnote -->
  <line x1="40" y1="262" x2="1080" y2="262" stroke="#262b35"/>
  <text x="40" y="288" fill="#8b93a3" font-size="12">야간 과목(18:00–21:00)은 조교 근무 시간과 절대 겹치지 않는다 → 낮을 비울수록 주 10시간 확보가 쉬워진다.</text>
  <text x="40" y="310" fill="#6d7482" font-size="11.5">코드 변환 규칙: 시작 시각 = (8 + 교시번호):00 · 종료 시각 = (8 + 끝교시번호 + 1):00</text>
</svg>
